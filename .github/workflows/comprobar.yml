# Comprobaciones en cada envío: que los dos scripts son los de src/ (./construir.sh --comprobar), que la
# ventana del Mac compila (en un Mac de GitHub, con el mismo swiftc y las mismas opciones que usa
# build_native_app) y que no hay errores de sintaxis (bash y el Python de las ventanas). No firma, no
# empaqueta y no publica nada.
name: Comprobar

on:
  push:
    branches: [main]
    paths: ["lvm-instalador.sh", "macos/lvm-instalador.sh", "macos/instalador.swift", "macos/empaquetar-dmg.sh", "src/**", "construir.sh", "ruff.toml", ".github/workflows/comprobar.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Ventana del Mac (Swift)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis de bash (con bash 5, como en el Mac; el /bin/bash 3.2 del sistema no lo lee)
        run: |
          b=$(brew --prefix)/bin/bash
          [ -x "$b" ] || brew install bash
          "$b" --version | head -1
          "$b" -n macos/lvm-instalador.sh
      - name: El script es el de src/
        run: ./construir.sh --comprobar
      - name: El Swift, de src/mac/ventana/ entera (lo mismo que swift_source)
        run: |
          ./construir.sh --ventana-mac main.swift
          wc -l main.swift
      - name: Compilar (como build_native_app)
        run: |
          xcrun --sdk macosx swiftc --version
          xcrun --sdk macosx swiftc -O -parse-as-library -target arm64-apple-macos12.0 -o lvm-app main.swift 2>&1 | tee compilar.log
          test -x lvm-app
      # El instalador del .dmg y el programa que dibuja su fondo, como los compila empaquetar-dmg.sh (no se
      # crea el .dmg: el fondo se dibuja para ver que funciona)
      - name: Compilar el instalador del .dmg (como empaquetar-dmg.sh)
        run: |
          mkdir -p instalador fondo
          cp macos/instalador.swift instalador/main.swift
          xcrun --sdk macosx swiftc -O -target arm64-apple-macos12.0 -o instalador/instalar instalador/main.swift -framework AppKit 2>&1 | tee compilar-instalador.log
          test -x instalador/instalar
      - name: Compilar y probar el fondo del .dmg (como empaquetar-dmg.sh)
        run: |
          sed -n "/^cat > \"\$BUILD\/fondo\/main.swift\" <<'EOF'$/,/^EOF$/p" macos/empaquetar-dmg.sh | sed '1d;$d' > fondo/main.swift
          test -s fondo/main.swift
          sed -n "/^ICON_PNG_B64='/,/^'$/p" macos/lvm-instalador.sh | sed '1s/^ICON_PNG_B64=.//; $d' | tr -d ' \n' | base64 --decode > fondo/logo.png
          sed -n "/^FONT_GOLDMAN_B64='/,/^'$/p" macos/lvm-instalador.sh | sed '1s/^FONT_GOLDMAN_B64=.//; $d' | tr -d ' \n' | base64 --decode > fondo/Goldman-Regular.ttf
          xcrun --sdk macosx swiftc -O -target arm64-apple-macos12.0 -o fondo/fondo fondo/main.swift -framework AppKit 2>&1 | tee compilar-fondo.log
          fondo/fondo fondo/fondo.png fondo/fondo@2x.png 0.0.0 fondo/logo.png 640 400 fondo/Goldman-Regular.ttf
          sips -g pixelWidth -g pixelHeight fondo/fondo.png fondo/fondo@2x.png
          tiffutil -cathidpicheck fondo/fondo.png fondo/fondo@2x.png -out fondo/fondo.tiff
      - name: Guardar el registro si falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: compilar-log
          path: |
            compilar.log
            main.swift
            compilar-instalador.log
            compilar-fondo.log
            fondo/fondo.png

  linux:
    name: Linux (bash y Python de la ventana) y revisión
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis de bash
        run: bash -n lvm-instalador.sh
      - name: Los dos scripts son los de src/
        run: ./construir.sh --comprobar
      - name: Sintaxis de cada sección de bash
        run: for f in src/linux/bash/*.sh src/mac/bash/*.sh src/comun/*/*.sh; do bash -n "$f" || exit 1; done
      - name: Sintaxis del Python (ventana de Linux, entera y cada fichero suyo, y túnel)
        run: |
          ./construir.sh --ventana ventana.py
          for f in ventana.py src/linux/ventana/*.py src/linux/tunel.py src/mac/tunel.py; do
            python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$f" || exit 1
          done
          echo ok
      # Revisión del código (paso 3 del mantenimiento): falla si ShellCheck o ruff encuentran algo. Fuera de
      # ShellCheck, lo que en este código es a propósito o un aviso falso; lo que es a propósito en una sola
      # línea va marcado allí (# shellcheck disable=…, # noqa: …) con el motivo. Reglas de ruff: ruff.toml.
      - name: ShellCheck (los dos scripts construidos)
        run: |
          shellcheck --version | head -2
          # SC2155 local x=$(…), SC2174 mkdir -p -m, SC2016 comillas simples con $ (Python dentro),
          # SC2015 A && B || C, SC2128/SC2178/SC2179 variables del mismo nombre en funciones distintas,
          # SC2018/SC2019 tr A-Z, SC1007 VAR= orden, SC2046/SC2206/SC2207 listas que se separan por
          # espacios a propósito (PIDs, servicios, opciones), SC2191 --proto =https
          ex=SC2155,SC2174,SC2016,SC2015,SC2128,SC2178,SC2179,SC2018,SC2019,SC1007,SC2046,SC2206,SC2207,SC2191
          bad=0
          for f in lvm-instalador.sh macos/lvm-instalador.sh; do
            out=$(shellcheck -s bash -S warning -e "$ex" -f gcc "$f" || true)
            n=$(grep -c . <<< "$out" || true)
            echo "### ShellCheck, $f: $n avisos" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$out" ] && continue
            echo "$out"
            echo "$out" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            bad=1
          done
          exit $bad
      - name: ruff (Python de la ventana de Linux y del túnel)
        run: |
          pip install --quiet ruff
          ruff --version
          # (la ventana, entera: cada fichero suyo usa lo de los demás. Cada aviso dice en qué fichero de
          # src/linux/ventana/ está)
          ./construir.sh --ventana ventana.py
          ruff check --output-format concise ventana.py src/linux/tunel.py src/mac/tunel.py > ruff-crudo.txt
          rc=$?
          python3 -I - ruff-crudo.txt src/linux/ventana > ruff.txt << 'PY'
          import os, re, sys
          folder = sys.argv[2]
          pieces, start = [], 1
          for n in sorted(os.listdir(folder)):
              k = open(os.path.join(folder, n), encoding="utf-8").read().count("\n")
              pieces.append((start, n))
              start += k + 2
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"ventana\.py:(\d+):(.*)", line)
              if m:
                  at = int(m.group(1))
                  first, n = [p for p in pieces if p[0] <= at][-1]
                  line = "src/linux/ventana/%s:%d:%s\n" % (n, at - first + 1, m.group(2))
              sys.stdout.write(line)
          PY
          cat ruff.txt
          echo "### ruff: $( [ "$rc" -eq 0 ] && echo sin avisos || grep -c ':[0-9]*:[0-9]*: ' ruff.txt) " >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
