# Comprobaciones en cada envío: que los dos scripts son los de src/ (./construir.sh --comprobar), que la
# ventana del Mac compila (en un Mac de GitHub, con el mismo swiftc y las mismas opciones que usa
# build_native_app) y que no hay errores de sintaxis (bash y el Python de las ventanas). No firma, no
# empaqueta y no publica nada.
name: Comprobar

on:
  push:
    branches: [main]
    paths: ["lvm-instalador.sh", "macos/lvm-instalador.sh", "src/**", "construir.sh", "ruff.toml", ".github/workflows/comprobar.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Ventana del Mac (Swift)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis de bash (con bash 5, como en el Mac; el /bin/bash 3.2 del sistema no lo lee)
        run: |
          b=$(brew --prefix)/bin/bash
          [ -x "$b" ] || brew install bash
          "$b" --version | head -1
          "$b" -n macos/lvm-instalador.sh
      - name: El script es el de src/
        run: ./construir.sh --comprobar
      - name: El Swift, de src/mac/ventana.swift (lo mismo que swift_source)
        run: |
          cp src/mac/ventana.swift main.swift
          wc -l main.swift
      - name: Compilar (como build_native_app)
        run: |
          xcrun --sdk macosx swiftc --version
          xcrun --sdk macosx swiftc -O -parse-as-library -target arm64-apple-macos12.0 -o lvm-app main.swift 2>&1 | tee compilar.log
          test -x lvm-app
      - name: Guardar el registro si falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: compilar-log
          path: |
            compilar.log
            main.swift

  linux:
    name: Linux (bash y Python de la ventana) y revisión
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis de bash
        run: bash -n lvm-instalador.sh
      - name: Los dos scripts son los de src/
        run: ./construir.sh --comprobar
      - name: Sintaxis de cada sección de bash
        run: for f in src/linux/bash/*.sh src/mac/bash/*.sh src/comun/*/*.sh; do bash -n "$f" || exit 1; done
      - name: Sintaxis del Python (ventana de Linux y túnel)
        run: |
          for f in src/linux/ventana.py src/linux/tunel.py src/mac/tunel.py; do
            python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$f" || exit 1
          done
          echo ok
      # Revisión del código (paso 3 del mantenimiento): falla si ShellCheck o ruff encuentran algo. Fuera de
      # ShellCheck, lo que en este código es a propósito o un aviso falso; lo que es a propósito en una sola
      # línea va marcado allí (# shellcheck disable=…, # noqa: …) con el motivo. Reglas de ruff: ruff.toml.
      - name: ShellCheck (los dos scripts construidos)
        run: |
          shellcheck --version | head -2
          # SC2155 local x=$(…), SC2174 mkdir -p -m, SC2016 comillas simples con $ (Python dentro),
          # SC2015 A && B || C, SC2128/SC2178/SC2179 variables del mismo nombre en funciones distintas,
          # SC2018/SC2019 tr A-Z, SC1007 VAR= orden, SC2046/SC2206/SC2207 listas que se separan por
          # espacios a propósito (PIDs, servicios, opciones), SC2191 --proto =https
          ex=SC2155,SC2174,SC2016,SC2015,SC2128,SC2178,SC2179,SC2018,SC2019,SC1007,SC2046,SC2206,SC2207,SC2191
          bad=0
          for f in lvm-instalador.sh macos/lvm-instalador.sh; do
            out=$(shellcheck -s bash -S warning -e "$ex" -f gcc "$f" || true)
            n=$(grep -c . <<< "$out" || true)
            echo "### ShellCheck, $f: $n avisos" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$out" ] && continue
            echo "$out"
            echo "$out" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            bad=1
          done
          exit $bad
      - name: ruff (Python de la ventana de Linux y del túnel)
        run: |
          pip install --quiet ruff
          ruff --version
          ruff check --output-format concise src/linux/ventana.py src/linux/tunel.py src/mac/tunel.py | tee ruff.txt
          rc=${PIPESTATUS[0]}
          echo "### ruff: $( [ "$rc" -eq 0 ] && echo sin avisos || grep -c ':[0-9]*:[0-9]*: ' ruff.txt) " >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
