# Comprobaciones en cada envío: que los dos scripts son los de src/ (./construir.sh --comprobar), que la
# ventana del Mac compila (en un Mac de GitHub, con el mismo swiftc y las mismas opciones que usa
# build_native_app) y que no hay errores de sintaxis (bash y el Python de las ventanas). No firma, no
# empaqueta y no publica nada.
name: Comprobar

on:
  push:
    branches: [main]
    paths: ["lvm-instalador.sh", "macos/lvm-instalador.sh", "src/**", "construir.sh", ".github/workflows/comprobar.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Ventana del Mac (Swift)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de bash (con bash 5, como en el Mac; el /bin/bash 3.2 del sistema no lo lee)
        run: |
          b=$(brew --prefix)/bin/bash
          [ -x "$b" ] || brew install bash
          "$b" --version | head -1
          "$b" -n macos/lvm-instalador.sh
      - name: El script es el de src/
        run: ./construir.sh --comprobar
      - name: El Swift, de src/mac/ventana.swift (lo mismo que swift_source)
        run: |
          cp src/mac/ventana.swift main.swift
          wc -l main.swift
      - name: Compilar (como build_native_app)
        run: |
          xcrun --sdk macosx swiftc --version
          xcrun --sdk macosx swiftc -O -parse-as-library -target arm64-apple-macos12.0 -o lvm-app main.swift 2>&1 | tee compilar.log
          test -x lvm-app
      - name: Guardar el registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilar-log
          path: |
            compilar.log
            main.swift

  linux:
    name: Linux (bash y Python de la ventana)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de bash
        run: bash -n lvm-instalador.sh
      - name: Los dos scripts son los de src/
        run: ./construir.sh --comprobar
      - name: Sintaxis de cada sección de bash
        run: for f in src/linux/bash/*.sh src/mac/bash/*.sh; do bash -n "$f" || exit 1; done
      - name: Sintaxis del Python (ventana de Linux y túnel)
        run: |
          for f in src/linux/ventana.py src/linux/tunel.py src/mac/tunel.py; do
            python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$f" || exit 1
          done
          echo ok

  # Revisión del código (paso 3 del mantenimiento). De momento solo avisa: cuenta lo que encuentra y lo deja
  # en el resumen de la ejecución, sin hacer fallar la comprobación. Fuera, lo que en este código es a
  # propósito o un aviso falso (ver src/LEEME.md).
  revision:
    name: Revisión (ShellCheck y ruff), solo avisa
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (los dos scripts construidos)
        run: |
          shellcheck --version | head -2
          # SC2155 local x=$(…), SC2174 mkdir -p -m, SC2016 comillas simples con $ (Python dentro),
          # SC2015 A && B || C, SC2128/SC2178/SC2179 variables del mismo nombre en funciones distintas,
          # SC2018/SC2019 tr A-Z, SC2034 variables que se leen con ${!nombre}, SC1007 VAR= orden
          ex=SC2155,SC2174,SC2016,SC2015,SC2128,SC2178,SC2179,SC2018,SC2019,SC2034,SC1007
          for f in lvm-instalador.sh macos/lvm-instalador.sh; do
            shellcheck -s bash -S warning -e "$ex" -f gcc "$f" > "sc-$(dirname "$f").txt" || true
            n=$(wc -l < "sc-$(dirname "$f").txt")
            echo "### ShellCheck, $f: $n avisos" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/.*\[(SC[0-9]+)\]$/\1/' "sc-$(dirname "$f").txt" | sort | uniq -c | sort -rn | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            cat "sc-$(dirname "$f").txt"
          done
      - name: ruff (Python de la ventana de Linux y del túnel)
        run: |
          pip install --quiet ruff
          ruff --version
          ruff check --output-format concise src/linux/ventana.py src/linux/tunel.py src/mac/tunel.py > ruff.txt || true
          cat ruff.txt
          echo "### ruff: $(grep -c ':[0-9]*:[0-9]*: ' ruff.txt) avisos" >> "$GITHUB_STEP_SUMMARY"
          grep -oE ': [A-Z]+[0-9]+ ' ruff.txt | sort | uniq -c | sort -rn | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar lo que ha salido
        uses: actions/upload-artifact@v4
        with:
          name: revision
          path: |
            sc-*.txt
            ruff.txt
