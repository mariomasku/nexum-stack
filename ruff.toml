# Revisión del Python (src/linux/ventana.py y el proxy del túnel): solo lo que encuentra fallos, no el estilo
# (el código usa % para dar formato, a propósito, como el resto del proyecto). La usa GitHub Actions.
# El túnel también va en el Mac, con el Python del sistema (3.9): nada más moderno que eso.
target-version = "py39"
line-length = 140

[lint]
# F: pyflakes (nombres que no existen, imports y variables sin usar); E9: errores de sintaxis;
# B: bugbear (errores típicos); PLE: errores de pylint
select = ["F", "E9", "B", "PLE"]
